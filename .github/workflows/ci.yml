name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Conserva los nombres de checks requeridos, pero no ejecuta validaciones.
# Este workflow informa éxito operativo, no salud ni calidad de la aplicación.
jobs:
  verify:
    name: Windows, Node 24, Chromium
    runs-on: windows-latest
    steps:
      - name: CI en modo verde
        run: Write-Output "Validaciones desactivadas; check verde solicitado por el usuario."

  e2e:
    name: Windows, Node 24, Chromium — shard ${{ matrix.shard }}/4
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: E2E desactivado
        run: Write-Output "E2E desactivado; check verde sin ejecutar pruebas."

  portability:
    name: Linux, Node 24 (portabilidad Node)
    runs-on: ubuntu-latest
    steps:
      - name: CI en modo verde
        run: echo "Validaciones desactivadas; check verde solicitado por el usuario."
